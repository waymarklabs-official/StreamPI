# StreamPI app launcher overrides — sourced by /usr/local/bin/streampi-app.
# Installed to /etc/streampi/apps.conf. Edit here rather than in the script so
# that reinstalling does not lose your changes.

# Point a service somewhere else, for instance a regional storefront:
#   URLS[prime]="https://www.primevideo.com/"
#   URLS[espn]="https://www.espn.com/espnplus/"

# Add your own tile. It shows up in Kodi automatically.
#   URLS[tubi]="https://tubitv.com/"
#   NAMES[tubi]="Tubi"

# Drop one you do not use:
#   unset 'URLS[spotify]'
