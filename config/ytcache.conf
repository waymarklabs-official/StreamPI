# StreamPI YouTube cache settings. Installed to /etc/streampi/ytcache.conf.
# Apply changes with:  sudo systemctl start streampi-ytcache.service

[ytcache]

# Where videos live. Also added to Kodi as the "YouTube Cache" video source.
cache_dir = /var/lib/streampi/youtube

# Netscape-format cookie file. Without it YouTube serves a generic logged-out
# feed instead of your recommendations -- see README, "Personalised
# recommendations". Keep this file mode 0600: it grants access to the account.
cookies = /etc/streampi/youtube-cookies.txt

# Which feed to fill from:
#   recommended   your YouTube home page recommendations  (needs cookies)
#   subscriptions new uploads from channels you follow    (needs cookies)
#   watchlater    your Watch Later queue                  (needs cookies)
#   trending      region-wide trending                    (no cookies needed)
source = recommended

# Hard ceiling on the cache. The installer sets this from the disk it actually
# finds; the effective budget is the smaller of this and (free space - reserve),
# recomputed on every run, so the cache shrinks rather than filling the disk.
max_cache_gb = 11

# Never let free disk space fall below this. Raspberry Pi OS gets unhappy well
# before zero -- apt, journald and Kodi's databases all need room.
reserve_gb = 4

# Delete a video once this much of it has been watched. Keep in step with
# playcountminimumpercent in advancedsettings.xml and the addon's own slider
# (Settings > Add-ons > Services > StreamPI YouTube Cache).
threshold_percent = 75

# Upper bound on how many videos to hold, independent of size.
max_videos = 40

# Skip anything longer than this; one three-hour video can swallow the cache.
max_duration_min = 90

# Skip Shorts, which are not worth a round trip to cache.
min_duration_sec = 70

# Cap resolution. 1080p H.264 is the sweet spot on a Pi: hardware-decoded on a
# Pi 4, comfortably software-decoded on a Pi 5, and roughly 2 MB per second of
# video. Raising this to 1440 or 2160 will blow through the cache quickly and
# will drop frames, because YouTube only offers VP9/AV1 above 1080p and neither
# has a hardware decoder on any Pi.
max_height = 1080
