# StreamPI — system-wide ALSA default pinned to vc4-HDMI-0.
# Installed to /etc/asound.conf. Any file previously there is saved as
# /etc/asound.conf.streampi-backup.
#
# Why not just "hw:vc4hdmi0,0":
#   The vc4-hdmi driver only accepts IEC958-framed audio at a handful of rates.
#   Handing it a raw 44.1kHz stereo stream fails with "Invalid argument". The
#   "hdmi:" plugin does the IEC958 framing, and wrapping that in "plug" adds rate
#   and format conversion so any client works without knowing the details.
#
# Card *id* is vc4hdmi0; "vc4-HDMI-0" is the human-readable long name shown by
# `aplay -l`. Referencing by id rather than card number matters because the
# number shifts depending on whether the analog bcm2835 card enumerates first.

pcm.streampi_hdmi0 {
    type plug
    slave.pcm {
        type hw
        card vc4hdmi0
        device 0
    }
    # Let ALSA pick a workable rate rather than failing outright.
    slave.rate unchanged
}

ctl.streampi_hdmi0 {
    type hw
    card vc4hdmi0
}

# dmix so more than one client can make noise at once (Kodi notification sounds
# over a stream, for instance) instead of the second one getting EBUSY.
pcm.streampi_shared {
    type dmix
    ipc_key 3141592
    ipc_perm 0666
    slave {
        pcm {
            type hw
            card vc4hdmi0
            device 0
        }
        period_time 0
        period_size 1024
        buffer_size 8192
        rate 48000
        channels 2
    }
}

pcm.!default {
    type plug
    slave.pcm "streampi_shared"
}

ctl.!default {
    type hw
    card vc4hdmi0
}
